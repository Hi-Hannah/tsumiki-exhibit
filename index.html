<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tchoban Foundation – Tsumiki Exhibition</title>
    <meta name="apple-mobile-web-app-title" content="Tchoban Foundation – Tsumiki Exhibition">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/favicon/favicon-light.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="images/favicon/favicon-dark.png" media="(prefers-color-scheme: dark)">
</head>
<body>
    <div class="header">
        <div class="title-section">
            <a href="http://www.tchoban-foundation.de/" target="_blank" rel="noopener noreferrer">
                <img id="logo" src="logo/logo_en.jpg" alt="Logo" class="logo">
            </a>
            <div class="logo-text">
                <span class="divider"></span>
                <div id="title-text">Kengo Kuma
                    <br>
                <span id="subtitle-text">Exhibition</span>
                </div>
            </div>
        </div>
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="en">en</button>
            <span class="divider"></span>
            <button class="lang-btn" data-lang="de">de</button>
        </div>
    </div>

    <div class="card-container">
        <div id="card-stack"></div>
    </div>

    <div class="controls">
        <button id="btn-undo" class="control-btn undo-btn" title="Previous card">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
            </svg>
        </button>
        <button id="btn-next" class="control-btn next-btn">
            <span>Next Card</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </button>
    </div>

    <div id="info-modal" class="modal">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close-btn" title="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-body">
                <h2 id="modal-title" class="card-title">Informationen</h2>
                <p id="modal-text" class="card-text"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
